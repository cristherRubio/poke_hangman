# nginx/ssl.conf
# PROD ONLY — mounted via docker-compose.prod.yml, absent in dev.
# Redirects :80 to :443 and terminates TLS, reusing the exact same
# locations.conf that dev's default.conf also includes.

server {
    listen 80;
    server_name poke-hangman.com www.poke-hangman.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name poke-hangman.com www.poke-hangman.com;

    ssl_certificate     /etc/nginx/certs/poke-hangman.com.pem;
    ssl_certificate_key /etc/nginx/certs/poke-hangman.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/conf.d/locations.conf;
}